[package]
name = "tauri-plugin-wallpaper"
version = "3.0.0"
authors = ["Meslzy"]
description = "A Tauri plugin to set your window as wallpaper behind desktop icons"
repository = "https://github.com/meslzy/tauri-plugin-wallpaper"
homepage = "https://github.com/meslzy/tauri-plugin-wallpaper"
documentation = "https://docs.rs/tauri-plugin-wallpaper"
edition = "2021"
rust-version = "1.93.0"
include = ["/permissions", "/src", "build.rs", "Cargo.toml"]
links = "tauri-plugin-wallpaper"
license = "MIT"

[package.metadata.platforms.support]
windows = { level = "full", notes = "Windows-only plugin using Win32 APIs" }
linux = { level = "none", notes = "Not supported - Windows-only plugin" }
macos = { level = "none", notes = "Not supported - Windows-only plugin" }
android = { level = "none", notes = "Not supported - Windows-only plugin" }
ios = { level = "none", notes = "Not supported - Windows-only plugin" }

[dependencies]
tauri = "^2.5.1"
serde = "^1.0.219"
thiserror = "^2.0.12"

[dependencies.windows]
version = "^0.61"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"]

[build-dependencies]
tauri-plugin = { version = "^2.2.0", features = ["build"] }
